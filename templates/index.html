{% extends "base.html" %}
{% block contenido %}
<section class="card">
  <h2>Estimar el precio de un coche usado</h2>
  <p>Indica sus características y adjunta una fotografía exterior para estimar su estado.</p>
  {% if error %}<p class="alert">{{ error }}</p>{% endif %}

  <form action="/tasar" method="POST" enctype="multipart/form-data" class="grid">
      <label>Marca del vehículo:</label>
      <select name="manufacturer" required>
          {% for marca in opciones.marcas %}
              <option value="{{ marca }}">{{ marca }}</option>
          {% endfor %}
      </select>

      <label>Año de fabricación:</label>
      <input type="number" name="year" min="1995" max="2021" required>

      <label>Millas recorridas:</label>
      <input type="number" name="odometer" min="1000" max="250000" required>

      <label>Tipo de combustible:</label>
      <select name="fuel" required>
          {% for combustible in opciones.combustibles %}
              <option value="{{ combustible }}">{{ combustible }}</option>
          {% endfor %}
      </select>

      <label>Tipo de vehículo:</label>
      <select name="type" required>
          {% for tipo in opciones.tipos %}
              <option value="{{ tipo }}">{{ tipo }}</option>
          {% endfor %}
      </select>

      <label>Transmisión:</label>
      <select name="transmission" required>
          {% for transmision in opciones.transmisiones %}
              <option value="{{ transmision }}">{{ transmision }}</option>
          {% endfor %}
      </select>

      <label>Fotografía del exterior:</label>
      <input type="file" name="foto" accept=".jpg, .jpeg, .png, .webp" required>

      <button type="submit">Calcular Tasación</button>
  </form>

</section>
{% endblock %}
